name: Docker

# Images are published by the Release workflow on every merge to main — this
# workflow is only a manual backfill: run it from the Actions tab with a v*
# tag selected as the ref to (re)publish that version's image. The semver
# tags derive from the selected ref; `latest` is deliberately NOT moved, so
# backfilling an old version can't roll users backward.
on:
  workflow_dispatch:

jobs:
  publish:
    name: Build & Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
