openapi: 3.1.0
info:
  title: fitbase API
  description: |
    Self-hosted cycling fitness data API. Designed for LLM agent consumption.
    All responses use a consistent `{"data": ..., "error": ...}` envelope.
    Field names always include units (e.g., `duration_secs`, `power_watts`).

    Many sync endpoints support `?stream=1` which switches the response to
    Server-Sent Events (`text/event-stream`) for real-time progress updates.
    SSE event types: `start` (total/pending counts), `file` (per-file progress),
    `done` (final counts), `error` (on failure).
  version: 0.2.0

servers:
  # Placeholder — when this spec is fetched from a running instance at
  # GET /openapi.yaml, the URL is rewritten to the host the request arrived on.
  - url: http://localhost:8080

paths:
  /openapi.yaml:
    get:
      summary: This spec
      description: |
        The OpenAPI spec itself, served so agents can discover the API from a
        running instance. The `servers` URL is rewritten to the request host,
        so the returned spec is immediately usable as a tool schema.
      responses:
        "200":
          description: OpenAPI 3.1 spec
          content:
            application/yaml: {}

  /api/workouts:
    get:
      summary: List workouts
      description: Returns workouts ordered by date descending.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 200 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: List of workouts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkoutListResponse"
    delete:
      summary: Delete all workouts
      description: Wipes all workouts and resets the imported files tracker.
      responses:
        "204":
          description: All workouts deleted

  /api/workouts/{id}:
    get:
      summary: Get workout
      parameters:
        - $ref: "#/components/parameters/WorkoutID"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkoutResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Delete workout
      parameters:
        - $ref: "#/components/parameters/WorkoutID"
      responses:
        "204":
          description: Workout deleted
        "404":
          $ref: "#/components/responses/NotFound"

  /api/workouts/{id}/streams:
    get:
      summary: Get time-series streams
      description: Returns per-second data points for power, HR, cadence, speed, GPS, altitude.
      parameters:
        - $ref: "#/components/parameters/WorkoutID"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreamsResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/workouts/{id}/summary:
    get:
      summary: Get compact workout summary (LLM-optimized)
      description: |
        Returns a condensed, prose-friendly summary of the workout.
        Omits raw streams. Ideal for feeding to an LLM agent as context.
        Distances in km, duration in minutes, power in watts.
      parameters:
        - $ref: "#/components/parameters/WorkoutID"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SummaryResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/workouts/{id}/download:
    get:
      summary: Download original FIT file
      description: Serves the original archived .fit file for the workout.
      parameters:
        - $ref: "#/components/parameters/WorkoutID"
      responses:
        "200":
          description: FIT file binary
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"

  /api/workouts/{id}/route:
    get:
      summary: Get route history
      description: Returns the route ID, route name, and all workouts that share the same route.
      parameters:
        - $ref: "#/components/parameters/WorkoutID"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouteResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/workouts/{id}/achievements:
    get:
      summary: Get workout achievements
      description: |
        Returns the workout's personal-best trophies, best rank first.
        A trophy of rank 1–3 means the workout beat all but rank-1 strictly
        earlier efforts in its category at the time it was recorded. Kinds:
        `route_time` and `route_power` (PRs on the matched route),
        `power_<secs>` (same-sport duration power bests at 5/60/300/1200/3600s),
        `longest_distance` and `most_climbing` (same-sport all-time records,
        rank 1 only). `value` is the metric that earned the trophy — seconds
        for `route_time`, watts for power kinds, meters otherwise.
      parameters:
        - $ref: "#/components/parameters/WorkoutID"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AchievementsResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/athlete:
    get:
      summary: Get athlete profile
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AthleteResponse"
    put:
      summary: Update athlete profile
      description: |
        Updates the athlete profile. `ftp_watts` and `weight_kg` are required
        and must be positive; all other fields are optional.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Athlete"
      responses:
        "200":
          description: Updated

  /api/fitness:
    get:
      summary: Get Fitness/Fatigue/Form training load history
      description: |
        Returns daily fitness metrics computed from TSS.
        - Fitness = long-term load, 42-day EMA
        - Fatigue = short-term load, 7-day EMA
        - Form    = Fitness minus Fatigue

        The series ends on the last settled day: today once a workout with TSS
        has been logged for it, otherwise yesterday. The last point is the
        rider's current state going into today.
      parameters:
        - name: days
          in: query
          schema: { type: integer, default: 90, maximum: 365 }
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FitnessResponse"

  /api/upload:
    post:
      summary: Upload a FIT file
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: Imported
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:     { type: string }
                      status: { type: string, enum: [imported, already_exists] }
        "422":
          description: Invalid FIT file

  /api/athlete/zones:
    get:
      summary: Get training zones
      description: Returns power zones (Z1–Z7 + Sweet Spot) and HR zones based on the athlete's current FTP and threshold HR.
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:  { $ref: "#/components/schemas/ZonesReport" }
                  error: { type: string, nullable: true }

  /api/athlete/power-curve:
    get:
      summary: Get all-time power curve
      description: |
        Returns best cycling power for 6 standard durations (5s, 30s, 1min, 5min, 20min, 60min)
        with watts/kg and % of FTP. Durations with no recorded effort are omitted. Power from
        other sports (e.g. running power) is not counted.
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:  { $ref: "#/components/schemas/PowerCurveReport" }
                  error: { type: string, nullable: true }

  /api/athlete/readiness:
    get:
      summary: Get today's readiness snapshot
      description: |
        Returns current fitness, fatigue, form, days since last workout, 4-week ramp rate,
        and a coaching recommendation. Designed as the first call for an AI coaching agent.
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:  { $ref: "#/components/schemas/ReadinessReport" }
                  error: { type: string, nullable: true }

  /api/workouts/{id}/feedback:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      summary: Get the rider's feedback on a workout
      description: How hard the ride felt (RPE 1–10) and the rider's note. Only workout_id when there is none.
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:  { $ref: "#/components/schemas/WorkoutFeedback" }
                  error: { type: string, nullable: true }
        "404": { description: No such workout }
    put:
      summary: Set the rider's feedback on a workout
      description: |
        Replaces the RPE and note. A null rpe with an empty note removes the feedback.
        Feedback survives an archive rebuild (workouts are re-created under the same id)
        and is removed when the workout is deleted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rpe:  { type: integer, minimum: 1, maximum: 10, nullable: true, example: 7 }
                note: { type: string, maxLength: 2000, example: "Legs heavy after a short night; cut the last rep." }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:  { $ref: "#/components/schemas/WorkoutFeedback" }
                  error: { type: string, nullable: true }
        "400": { description: rpe outside 1–10, note over 2000 characters, or invalid JSON }
        "404": { description: No such workout }

  /api/athlete/ftp:
    put:
      summary: Set the FTP
      description: |
        Changes the FTP alone, effective now; the rest of the profile is untouched
        (unlike PUT /api/athlete, which replaces the whole profile). Past workouts keep
        the FTP that was active on their date. Logs an FTP history entry only when the
        value changes (or there is no history yet). Returns the FTP check against the new
        value.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ftp_watts]
              properties:
                ftp_watts: { type: integer, minimum: 1, maximum: 600, example: 215 }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:  { $ref: "#/components/schemas/FTPCheck" }
                  error: { type: string, nullable: true }
        "400": { description: ftp_watts missing or outside 1–600 }

  /api/athlete/ftp-check:
    get:
      summary: Check the FTP against recent best efforts
      description: |
        Estimates FTP from the best cycling efforts of the last 90 days — the higher of 95% of the
        best 20-minute power and the best 60-minute power — and compares it with the set
        FTP. Every power-derived number (zones, IF, TSS, fitness) scales with FTP.
        Statuses: `raise` (estimate above 103% of FTP: the rider produced the power, so FTP
        is low), `ok` (95–103%), `lower` (85–95%: FTP may be set high), `unverified`
        (below 85%, or no 20/60-minute effort: more likely no hard riding than a real loss,
        so no number is suggested). An indoor ride of a rider with a separate indoor FTP
        line is scored against that line, so its effort is compared in general-line terms
        (`equivalent_watts` on the basis).
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:  { $ref: "#/components/schemas/FTPCheck" }
                  error: { type: string, nullable: true }

  /api/athlete/ftp-check/dismiss:
    post:
      summary: Keep the current FTP despite the check
      description: |
        Hides the raise/lower prompt for 30 days, or until the FTP or the verdict changes.
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:  { $ref: "#/components/schemas/FTPCheck" }
                  error: { type: string, nullable: true }
        "409": { description: The check is ok or unverified — nothing to dismiss }

  /api/training/weekly:
    get:
      summary: Get weekly training breakdown
      description: |
        Returns per-ISO-week totals for TSS, duration, distance, elevation, and workout count.
        Weeks with no activity are omitted. Useful for periodization analysis.
      parameters:
        - name: weeks
          in: query
          schema: { type: integer, default: 12, maximum: 52 }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:  { type: array, items: { $ref: "#/components/schemas/WeeklyLoad" } }
                  error: { type: string, nullable: true }

  /api/analytics/compare:
    get:
      summary: Compare one period with another
      description: |
        The Analytics page's period comparison: every metric of one period beside another,
        with the change. Days are training days (the day the rider rode, in their own
        timezone), and "today" is the viewer's (the `tz` cookie, else the athlete's timezone).

        A week is Monday to Sunday, a month and a year are calendar ones, and `custom` is any
        run of days. A period still running is cut at today and the period it is compared
        against is cut to match (`to_date`): the first 21 days of last month against the
        first 21 of this one. A period picked with `against=custom` is never cut.

        Built from per-ride aggregates (workout columns, stored power curves, zone times,
        cached decoupling), never streams. Power-derived numbers (NP, IF, kJ, power zones,
        best efforts, EF, matched power) read cycling rides only. EF and the matched markers
        come from steady rides (IF 0.55–0.80, 45 min+), outdoor and indoor kept apart;
        decoupling from long steady rides (90 min+). Rows exist only for metrics at least one
        period has: a rider without a power meter or HR strap gets volume rows.
      parameters:
        - { name: period, in: query, schema: { type: string, enum: [week, month, year, custom], default: month } }
        - { name: date, in: query, schema: { type: string, format: date }, description: "A day in the period, for week, month and year. Default today." }
        - { name: from, in: query, schema: { type: string, format: date }, description: "First day of a custom period (required with period=custom)." }
        - { name: to, in: query, schema: { type: string, format: date }, description: "Last day of a custom period, inclusive (required with period=custom)." }
        - { name: against, in: query, schema: { type: string, enum: [previous, year, custom], default: previous }, description: "The period before, the same period a year earlier (52 weeks for a week), or a period of your own." }
        - { name: against_from, in: query, schema: { type: string, format: date }, description: "First day of the comparison period (required with against=custom)." }
        - { name: against_to, in: query, schema: { type: string, format: date }, description: "Last day of the comparison period, inclusive (required with against=custom)." }
        - { name: scope, in: query, schema: { type: string }, description: "`all` or a sport (cycling, running, swimming, hiking). Default cycling when the rider has rides, else all. The sport split always shows every sport." }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:  { $ref: "#/components/schemas/PeriodComparison" }
                  error: { type: string, nullable: true }
        "400": { description: "An unknown period, against or scope; a malformed day; a custom range that runs backwards or is longer than 3700 days" }

  /api/analytics/trends:
    get:
      summary: Every performance marker over a range of time
      description: |
        The Analytics page's trends: FTP history (general and indoor lines) against what the
        rides implied, the power curve now against all-time, fitness/fatigue/form and the
        weekly ramp, weekly and monthly load against plan, and per week or month: EF (outdoor
        and indoor apart), HR at matched power, power at matched HR, decoupling, cadence, IF
        distribution, intensity split, RPE and active days; best efforts by month at
        5 s / 1 min / 5 min / 20 min / 60 min; and streaks.

        Ranges end today and start on a bucket boundary: `3m` and `6m` are bucketed by week,
        `1y`, `2y` and `all` by month. Load and consistency count every sport; power-derived
        markers read cycling rides only. Matched markers are read at the median power and
        heart rate of the range's steady rides (`reference`), within 7.5% and 4%. W/kg, where
        a client shows it, can only use today's weight: fitbase keeps no weight history.
      parameters:
        - { name: range, in: query, schema: { type: string, enum: ["3m", "6m", "1y", "2y", all], default: "1y" } }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:  { $ref: "#/components/schemas/AnalyticsTrends" }
                  error: { type: string, nullable: true }
        "400": { description: Unknown range }

  /api/analytics/years:
    get:
      summary: The last five calendar years, day by day
      description: |
        Each year's training per training day (time, distance, elevation, TSS), for
        cumulative year-over-year charts. Days are placed on a leap-year calendar
        (`day_of_year` 1–366) so March 1 is day 61 in every year. Years without any activity
        in scope are left out; `today` marks how far into the current year we are.
      parameters:
        - { name: scope, in: query, schema: { type: string }, description: "`all` or a sport. Default cycling when the rider has rides, else all." }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:  { $ref: "#/components/schemas/YearOverYear" }
                  error: { type: string, nullable: true }
        "400": { description: Unknown scope }

  /api/planned-workouts:
    get:
      summary: List planned workouts
      description: |
        Returns future-dated planned workouts in the inclusive date range
        `[start, end]`. Planned workouts are independent of completed workouts —
        nothing auto-matches them by date. If `start`/`end` are omitted the
        default window is today minus 7 days through today plus 30 days.
      parameters:
        - name: start
          in: query
          schema: { type: string, format: date, example: "2026-06-01" }
          description: Inclusive range start, YYYY-MM-DD. Defaults to 7 days ago.
        - name: end
          in: query
          schema: { type: string, format: date, example: "2026-07-01" }
          description: Inclusive range end, YYYY-MM-DD. Defaults to 30 days out.
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:  { type: array, items: { $ref: "#/components/schemas/PlannedWorkout" } }
                  error: { type: string, nullable: true }
    post:
      summary: Create a planned workout
      description: |
        Adds one user-authored planned workout (the calendar quick-add). When
        `intervals` are supplied they are the source of truth for duration, which
        overrides `duration_secs`. When `intensity_factor` is given without `tss`,
        TSS is estimated as IF² × hours × 100.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlannedWorkoutCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:  { $ref: "#/components/schemas/PlannedWorkout" }
                  error: { type: string, nullable: true }
        "400":
          description: Invalid request body (bad date, out-of-range target, non-positive duration, malformed intervals)

  /api/planned-workouts/{id}:
    delete:
      summary: Delete a planned workout
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: Planned workout ID
      responses:
        "204":
          description: Planned workout deleted
        "404":
          $ref: "#/components/responses/NotFound"

  /api/planned-workouts/drafts/{id}:
    get:
      summary: Preview a coach-proposed schedule draft
      description: |
        Returns the validated planned workouts inside a draft created by the AI
        coach's `propose_schedule` tool, without persisting anything. The chat
        UI renders these as the "review and add to calendar" preview card.
      parameters:
        - $ref: "#/components/parameters/DraftID"
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:  { type: array, items: { $ref: "#/components/schemas/PlannedWorkout" } }
                  error: { type: string, nullable: true }
        "400":
          description: Draft contains an invalid item
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Discard a schedule draft
      description: Removes the draft without committing anything to the calendar.
      parameters:
        - $ref: "#/components/parameters/DraftID"
      responses:
        "204":
          description: Draft discarded (idempotent — also 204 if it never existed)

  /api/planned-workouts/drafts/{id}/commit:
    post:
      summary: Commit a schedule draft to the calendar
      description: |
        Persists every workout in the draft (as `source: coach`) and removes the
        draft, atomically: if any item fails validation or any insert fails, the
        whole batch rolls back and the draft survives for retry — a retry can
        never duplicate workouts.
      parameters:
        - $ref: "#/components/parameters/DraftID"
      responses:
        "201":
          description: All workouts created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:  { type: array, items: { $ref: "#/components/schemas/PlannedWorkout" } }
                  error: { type: string, nullable: true }
        "400":
          description: Draft contains an invalid item (nothing persisted)
        "404":
          $ref: "#/components/responses/NotFound"

  /api/workouts/{id}/analysis:
    get:
      summary: Get workout analysis
      description: |
        Returns zone distribution (power and HR), variability index (NP/AP),
        efficiency factor (NP/avg HR), and 90-day sport-scoped averages for comparison.
        Zone data requires the workout to have been imported with a configured FTP/threshold HR.
      parameters:
        - $ref: "#/components/parameters/WorkoutID"
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:  { $ref: "#/components/schemas/WorkoutAnalysis" }
                  error: { type: string, nullable: true }
        "404":
          $ref: "#/components/responses/NotFound"

  /api/workouts/{id}/shape:
    get:
      summary: Get workout shape (intervals)
      description: |
        What happened inside one ride. Efforts are auto-detected from the power
        stream (sustained work at or above ~85% FTP of the ride date), repeated
        efforts are grouped into sets with per-rep power, fade, and HR creep, and
        a coarse time-bucketed profile (at most 30 buckets) covers pacing and
        drift. Workouts planned for the same day and sport are attached so
        execution can be compared with the prescription.
      parameters:
        - $ref: "#/components/parameters/WorkoutID"
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:  { $ref: "#/components/schemas/WorkoutShape" }
                  error: { type: string, nullable: true }
        "404":
          $ref: "#/components/responses/NotFound"

  /api/coach/insights:
    get:
      summary: Get cached coaching insights
      description: |
        Returns the most recently generated coaching response without calling
        the LLM. Content is a Markdown blob.
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:  { $ref: "#/components/schemas/CachedInsights" }
                  error: { type: string, nullable: true }
        "204":
          description: Nothing has been generated yet
    post:
      summary: Generate coaching insights (SSE)
      description: |
        Streams a full training review from the configured LLM provider as
        Server-Sent Events, then caches the response. POST because it mutates
        the cache and is rate-limit-worthy.
        SSE event types: `chunk` (`{"text": "..."}` Markdown delta),
        `done` (`{"provider", "model", "generated_at"}`),
        `error` (`{"error": "..."}`, fatal; stream ends).
      responses:
        "200":
          description: SSE stream of the generated insights
          content:
            text/event-stream:
              schema: { type: string }
        "400":
          description: Unknown provider configured
        "503":
          description: AI coach not configured (no provider or API key saved)

  /api/coach/chat:
    post:
      summary: Chat with the AI coach (tool-augmented, SSE)
      description: |
        Runs one conversational turn with the coach. The browser owns the
        conversation and posts the full history every turn — the server is
        stateless. The model pulls data via server-executed tools (readiness,
        recent workouts, power curve, …) and can propose a training schedule,
        which is stored as a draft for the rider to review
        (see `/api/planned-workouts/drafts/{id}`). Only the most recent 40
        messages are considered.
        SSE event types: `tool` (`{"name", "label", "status": "running"|"done"|"error"}`),
        `chunk` (`{"text": "..."}` answer delta),
        `preview` (`{"id", "count"}` — a schedule draft was created),
        `done` (`{"provider", "model", "generated_at"}`),
        `error` (`{"error": "..."}`, fatal; stream ends).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [messages]
              properties:
                messages:
                  type: array
                  description: Full conversation so far; must end with a user message.
                  items:
                    type: object
                    required: [role, content]
                    properties:
                      role:    { type: string, enum: [user, assistant] }
                      content: { type: string }
      responses:
        "200":
          description: SSE stream of tool progress and the answer
          content:
            text/event-stream:
              schema: { type: string }
        "400":
          description: Invalid history, or the configured provider does not support tool use
        "503":
          description: AI coach not configured (no provider or API key saved)

  /api/coach/weekly-plan:
    get:
      summary: Get the latest weekly plan
      description: |
        The most recent coach weekly review and proposed week (failed runs are
        hidden), its proposed workouts in PlannedWorkout shape, and the
        Sunday-night auto-plan setting. `plan` is null when none exists.
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      plan:     { allOf: [ { $ref: "#/components/schemas/WeeklyPlan" } ], nullable: true }
                      workouts: { type: array, items: { $ref: "#/components/schemas/PlannedWorkout" } }
                      schedule: { $ref: "#/components/schemas/WeeklyPlanSchedule" }
                      preferences: { $ref: "#/components/schemas/WeeklyPlanPreferences" }
    post:
      summary: Generate (or revise) a weekly plan (SSE)
      description: |
        The coach reviews recent training — grading key sessions rep by rep —
        and proposes the 7 days starting tomorrow (athlete timezone). With
        `revise_id`, it revises that plan per `notes`, replaying the earlier
        constraints and its proposed week. The revised plan covers what is left of
        that plan's week (from today when revised on a later day, through its last
        day); the coach changes only what `notes` asks, and `review_md` keeps the
        earlier review with the coach's change note added under it. Revising a plan
        whose week is over plans the 7 days starting tomorrow, with a new review.
        The run is detached: closing the stream doesn't cancel it;
        re-attach via `/api/coach/weekly-plan/runs/{id}/events`. The result is
        stored as a plan the rider accepts onto the calendar; nothing is added
        automatically.
        SSE events: `job` (`{"id"}`), `tool`, `chunk` (review text; on a
        revision, the change note),
        `done` (`{"plan_id"}`), `error`.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                notes:     { type: string, maxLength: 500, description: "Constraints, or what to change when revising" }
                revise_id: { type: string, description: "Plan to revise; notes are then required" }
      responses:
        "200":
          description: SSE stream of tool progress and the review
          content:
            text/event-stream:
              schema: { type: string }
        "400":
          description: Notes too long, revision without notes, or the provider does not support tool use
        "404":
          description: No plan to revise with that id
        "409":
          description: A weekly plan is already being generated
        "503":
          description: AI coach not configured

  /api/coach/weekly-plan/active:
    get:
      summary: Current weekly-plan run
      description: "`{id, done}` for the current (or last) run — manual or the scheduled Sunday-night run — or 204 when none since startup."
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:   { type: string }
                      done: { type: boolean }
        "204":
          description: No run since startup

  /api/coach/weekly-plan/runs/{id}/events:
    get:
      summary: Re-attach to a weekly-plan run (SSE)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Replays the run's events, then tails until it finishes
        "404":
          description: Superseded by a newer run, or the server restarted

  /api/coach/weekly-plan/schedule:
    put:
      summary: Turn the Sunday-night auto-plan on or off
      description: |
        When on, the server generates a plan every Sunday at 20:00 (athlete
        timezone) for the coming Monday–Sunday, unless the rider already
        planned that week. A missed run (server off) is caught up when the
        server is next running; failures retry at most 3 times a week, an hour
        apart. Generated plans wait for the rider to accept them.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/WeeklyPlanSchedule" }
        "400":
          description: Body is missing `enabled`

  /api/coach/weekly-plan/preferences:
    put:
      summary: Set training days and weekly hours for weekly plans
      description: |
        The rider's standing availability, used by every plan run including the
        Sunday auto-plan. Proposals are enforced against it: a workout on a day
        not listed, or a week more than 10% over `weekly_hours`, is rejected
        back to the coach, which re-plans. A revision made later in the week
        plans only the days left, and its week still counts the sessions the
        plan had on the days before.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WeeklyPlanPreferences" }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/WeeklyPlanPreferences" }
        "400":
          description: No days, an unknown or repeated day, or hours outside 1–40

  /api/coach/weekly-plan/{id}/accept:
    post:
      summary: Add a weekly plan's workouts to the calendar
      description: |
        Adds the proposed week as coach-sourced planned workouts, replacing
        coach entries already on those dates (manual entries are kept), and
        marks the plan accepted. A plan can be accepted once.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "201":
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/PlannedWorkout" } }
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Already accepted or discarded, or the plan proposed no workouts

  /api/coach/weekly-plan/{id}/discard:
    post:
      summary: Dismiss a weekly plan
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Discarded
        "404":
          $ref: "#/components/responses/NotFound"

  /api/coach/models:
    post:
      summary: List available models for a provider
      description: |
        Fetches the provider's live model catalog so the settings page can
        refresh its dropdown. The API key is taken from the request body (the
        value just typed) and falls back to the saved key when it belongs to
        the same provider. Providers without live listing return their curated
        fallback. POST (not GET) because the key travels in the body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider]
              properties:
                provider: { type: string, example: "anthropic" }
                api_key:  { type: string, description: "Optional; falls back to the saved key for this provider." }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      models:
                        type: array
                        items:
                          type: object
                          properties:
                            value: { type: string, example: "claude-sonnet-4-6" }
                            label: { type: string, example: "Claude Sonnet 4.6" }
                  error: { type: string, nullable: true }
        "400":
          description: Missing provider or invalid request body
        "502":
          description: Provider API could not be reached or rejected the key

  /api/integrations/dropbox/sync:
    get:
      summary: Sync FIT files from Dropbox
      description: |
        Pulls new FIT files from the configured Dropbox folder.
        Without `?stream=1` starts a background sync and returns 202.
        With `?stream=1` streams progress as Server-Sent Events.
      parameters:
        - $ref: "#/components/parameters/StreamMode"
      responses:
        "202":
          description: Sync started in background
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncStartedResponse"
        "200":
          description: SSE progress stream (when stream=1)
          content:
            text/event-stream:
              schema: { type: string }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/integrations/dropbox/longpoll:
    post:
      summary: Enable or disable Dropbox longpoll auto-sync
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  /api/integrations/dropbox:
    delete:
      summary: Disconnect Dropbox
      description: Removes stored token and stops the longpoll watcher.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  /api/integrations/intervals/sync:
    get:
      summary: Sync activities from intervals.icu
      description: |
        Pulls new FIT files from intervals.icu.
        Without `?stream=1` starts a background sync and returns 202.
        With `?stream=1` streams progress as Server-Sent Events.
      parameters:
        - $ref: "#/components/parameters/StreamMode"
      responses:
        "202":
          description: Sync started in background
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncStartedResponse"
        "200":
          description: SSE progress stream (when stream=1)
          content:
            text/event-stream:
              schema: { type: string }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/integrations/intervals/ftp-sync:
    get:
      summary: Rebuild the FTP history from intervals.icu
      description: |
        Replaces the FTP history with the change points in the FTP intervals.icu recorded
        on each ride (other sports' FTPs are ignored), on two lines: the general FTP and,
        for riders with a separate indoor FTP, an indoor line. Sets the profile FTP to the
        latest general FTP, also when the newest change is an indoor one that no outdoor
        ride has confirmed yet (indoor rides use it from the indoor line). Then recomputes
        TSS and IF for every power-based workout.
        Streams progress as Server-Sent Events (`ftpchanges`, `recompute`, then `done`
        with `{"updated": n}` or `error`).
      responses:
        "200":
          description: SSE progress stream
          content:
            text/event-stream:
              schema: { type: string }

  /api/integrations/intervals/fetch/{id}:
    get:
      summary: Fetch a single activity from intervals.icu
      description: Downloads and imports one activity by its intervals.icu ID. Useful for debugging failed sync items.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: intervals.icu activity ID
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      activity_id: { type: string }
                      status:      { type: string, enum: [imported, skipped, download_failed, import_failed] }
                      workout_id:  { type: string, nullable: true }
                      error:       { type: string, nullable: true }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/integrations/intervals/autosync:
    post:
      summary: Enable or disable intervals.icu auto-sync
      description: When enabled, polls for new activities every 15 minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  /api/integrations/intervals:
    delete:
      summary: Disconnect intervals.icu
      description: Removes stored credentials and stops the auto-sync poller.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  /api/integrations/gdrive/connect:
    get:
      summary: Start Google Drive OAuth flow
      description: Redirects to Google's consent screen. Completes via a loopback callback server.
      responses:
        "302":
          description: Redirect to Google OAuth consent screen

  /api/integrations/gdrive/sync:
    get:
      summary: Upload archived FIT files to Google Drive
      description: |
        Uploads all locally archived FIT files to the connected Drive folder.
        Without `?stream=1` runs in the background and returns 202.
        With `?stream=1` streams progress as Server-Sent Events.
      parameters:
        - $ref: "#/components/parameters/StreamMode"
      responses:
        "202":
          description: Sync started in background
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncStartedResponse"
        "200":
          description: SSE progress stream (when stream=1)
          content:
            text/event-stream:
              schema: { type: string }
        "503":
          description: Google Drive not connected

  /api/integrations/gdrive/restore:
    post:
      summary: Restore FIT files from Google Drive
      description: Re-imports all FIT files found in the connected Drive folder. Runs in background.
      responses:
        "202":
          description: Restore started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncStartedResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/integrations/gdrive:
    delete:
      summary: Disconnect Google Drive
      description: Removes the stored OAuth token.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

components:
  parameters:
    WorkoutID:
      name: id
      in: path
      required: true
      schema: { type: string }
      description: Workout ID (first 16 hex chars of SHA-256 of FIT file content)

    StreamMode:
      name: stream
      in: query
      schema: { type: integer, enum: [0, 1], default: 0 }
      description: Set to 1 to receive a Server-Sent Events progress stream instead of a background response.

    DraftID:
      name: id
      in: path
      required: true
      schema: { type: string }
      description: Schedule draft ID (from the chat `preview` SSE event)

  schemas:
    CachedInsights:
      type: object
      properties:
        content:      { type: string, description: "Full coaching response as Markdown" }
        provider:     { type: string, example: "anthropic" }
        model:        { type: string, example: "claude-sonnet-4-6" }
        generated_at: { type: string, format: date-time }

    Workout:
      type: object
      properties:
        id:                     { type: string, example: "a3f9c2d1e4b5f6a7" }
        filename:               { type: string }
        training_day:           { type: string, format: date, example: "2026-08-16", description: "Calendar day the ride happened, in the ride's own timezone. All day/week analytics bucket by this." }
        recorded_at:            { type: string, format: date-time, example: "2026-08-16T07:30:00-06:00", description: "Start instant, serialized with the ride's own UTC offset — the wall-clock time on the athlete's device." }
        utc_offset_secs:        { type: integer, example: -21600, description: "UTC offset in effect where/when the ride started, resolved at import (device-declared, else GPS timezone, else athlete profile)." }
        start_lat:              { type: number, nullable: true, description: "First GPS fix; absent for indoor rides." }
        start_lng:              { type: number, nullable: true }
        county:                 { type: string, nullable: true, example: "Boulder County", description: "US county containing the start point; absent outside the US or indoors." }
        state:                  { type: string, nullable: true, example: "CO", description: "USPS state code for the start point." }
        sport:                  { type: string, enum: [cycling, running, swimming, hiking, other] }
        duration_secs:          { type: integer }
        elapsed_secs:           { type: integer }
        distance_meters:        { type: number }
        elevation_gain_meters:  { type: number }
        avg_power_watts:        { type: number, nullable: true }
        max_power_watts:        { type: number, nullable: true }
        normalized_power_watts: { type: number, nullable: true }
        avg_heart_rate_bpm:     { type: integer, nullable: true }
        max_heart_rate_bpm:     { type: integer, nullable: true }
        avg_cadence_rpm:        { type: integer, nullable: true }
        avg_speed_mps:          { type: number }
        tss:                    { type: number, nullable: true }
        intensity_factor:       { type: number, nullable: true }
        is_indoor:              { type: boolean }
        route_id:               { type: string, nullable: true }
        created_at:             { type: string, format: date-time }

    WorkoutSummary:
      type: object
      properties:
        id:                     { type: string }
        training_day:           { type: string, format: date, example: "2024-03-15", description: "Ride-local calendar day." }
        sport:                  { type: string }
        duration_mins:          { type: number }
        distance_km:            { type: number }
        elevation_gain_meters:  { type: number }
        avg_power_watts:        { type: number, nullable: true }
        normalized_power_watts: { type: number, nullable: true }
        avg_heart_rate_bpm:     { type: integer, nullable: true }
        tss:                    { type: number, nullable: true }
        intensity_factor:       { type: number, nullable: true }

    Stream:
      type: object
      properties:
        timestamp:       { type: string, format: date-time }
        power_watts:     { type: integer, nullable: true }
        heart_rate_bpm:  { type: integer, nullable: true }
        cadence_rpm:     { type: integer, nullable: true }
        speed_mps:       { type: number, nullable: true }
        altitude_meters: { type: number, nullable: true }
        lat:             { type: number, nullable: true }
        lng:             { type: number, nullable: true }
        distance_meters: { type: number, nullable: true }

    Athlete:
      type: object
      properties:
        ftp_watts:        { type: integer, example: 280 }
        weight_kg:        { type: number, example: 72.5 }
        threshold_hr_bpm: { type: integer }
        max_hr_bpm:       { type: integer }
        resting_hr_bpm:   { type: integer }
        age:              { type: integer }
        location:         { type: string }
        language:         { type: string }
        timezone:         { type: string }
        units:            { type: string, enum: [metric, imperial] }
        setup_complete:   { type: boolean }
        updated_at:       { type: string, format: date-time }

    PlannedInterval:
      type: object
      description: |
        One node in a structured planned workout. A node is either a *leaf step*
        (a duration with an optional power target) or a *repeat group* (a `steps`
        sequence run `repeat` times) — never both. Set a flat target with one of
        `target_pct_ftp` / `target_watts` / `target_zone`, OR a ramp with
        `target_pct_ftp_start` + `target_pct_ftp_end` (mutually exclusive).
        Nesting is capped at 3 levels.
      properties:
        kind:                 { type: string, enum: [warmup, work, recovery, cooldown, endurance, sweet_spot, threshold, vo2max] }
        duration_secs:        { type: integer, description: "Required on a leaf step; must be > 0." }
        target_pct_ftp:       { type: integer, minimum: 0, maximum: 200, nullable: true }
        target_pct_ftp_start: { type: integer, minimum: 0, maximum: 200, nullable: true, description: "Ramp start; requires target_pct_ftp_end." }
        target_pct_ftp_end:   { type: integer, minimum: 0, maximum: 200, nullable: true, description: "Ramp end; requires target_pct_ftp_start." }
        target_watts:         { type: integer, minimum: 0, nullable: true }
        target_zone:          { type: string, example: "Z2" }
        note:                 { type: string }
        repeat:               { type: integer, description: "Times to run this node; 0 or 1 means once." }
        steps:
          type: array
          description: Child steps; when non-empty this node is a repeat group.
          items: { $ref: "#/components/schemas/PlannedInterval" }

    PlannedWorkoutCreate:
      type: object
      required: [date]
      description: Request body for creating a planned workout.
      properties:
        date:             { type: string, format: date, example: "2026-06-15", description: "YYYY-MM-DD." }
        sport:            { type: string, default: cycling }
        title:            { type: string }
        description:      { type: string }
        duration_secs:    { type: integer, description: "Used when no intervals are supplied; must be > 0. Ignored if intervals total > 0." }
        tss:              { type: number, nullable: true }
        intensity_factor: { type: number, minimum: 0, maximum: 1.5, nullable: true, description: "When set without tss, TSS is estimated as IF² × hours × 100." }
        intervals:
          type: array
          items: { $ref: "#/components/schemas/PlannedInterval" }

    PlannedWorkout:
      type: object
      properties:
        id:               { type: string }
        planned_date:     { type: string, format: date-time, example: "2026-06-15T00:00:00Z", description: "Date-only value, serialized as a UTC midnight timestamp." }
        sport:            { type: string, example: cycling }
        title:            { type: string }
        description:      { type: string }
        duration_secs:    { type: integer }
        tss:              { type: number, nullable: true }
        intensity_factor: { type: number, nullable: true }
        intervals:
          type: array
          items: { $ref: "#/components/schemas/PlannedInterval" }
        source:           { type: string, enum: [manual, coach] }
        created_at:       { type: string, format: date-time }

    WeeklyPlan:
      type: object
      properties:
        id:           { type: string }
        created_at:   { type: string, format: date-time }
        trigger:      { type: string, enum: [manual, scheduled] }
        window_start: { type: string, format: date, description: "First planned day, athlete-local" }
        window_end:   { type: string, format: date }
        status:       { type: string, enum: [ready, accepted, discarded, failed] }
        request:      { type: string, description: "The rider's request, including every constraint and revision so far" }
        review_md:    { type: string, description: "The coach's review and plan summary (Markdown); a revision keeps the review it revises and adds a \"Revised:\" change note under it" }
        error:        { type: string, nullable: true }

    WeeklyPlanPreferences:
      type: object
      required: [days]
      properties:
        days:
          type: array
          items: { type: string, enum: [mon, tue, wed, thu, fri, sat, sun] }
          description: Days the rider can train; returned Monday first. Every day when never set.
        weekly_hours:
          type: number
          nullable: true
          minimum: 1
          maximum: 40
          description: Weekly training-time budget; null lets the coach choose the volume

    WeeklyPlanSchedule:
      type: object
      properties:
        enabled:  { type: boolean }
        next_run: { type: string, format: date-time, nullable: true, description: "Next Sunday 20:00 (athlete timezone); only when enabled" }

    FitnessPoint:
      type: object
      properties:
        date:    { type: string, format: date-time }
        fitness: { type: number, description: "Chronic Training Load (42-day EMA of TSS)" }
        fatigue: { type: number, description: "Acute Training Load (7-day EMA of TSS)" }
        form:    { type: number, description: "Fitness minus Fatigue" }

    ZonesReport:
      type: object
      properties:
        ftp_watts:       { type: integer }
        threshold_hr_bpm: { type: integer }
        power_zones:
          type: array
          items:
            type: object
            properties:
              label:      { type: string, example: "Z2" }
              name:       { type: string, example: "Endurance" }
              pct_low:    { type: integer }
              pct_high:   { type: integer }
              watts_low:  { type: integer }
              watts_high: { type: integer }
        hr_zones:
          type: array
          items:
            type: object
            properties:
              label:    { type: string }
              name:     { type: string }
              pct_low:  { type: integer }
              pct_high: { type: integer }
              bpm_low:  { type: integer }
              bpm_high: { type: integer }

    PowerCurveEntry:
      type: object
      properties:
        duration_secs:  { type: integer }
        duration_label: { type: string, example: "20min" }
        watts:          { type: integer }
        watts_per_kg:   { type: number }
        pct_ftp:        { type: number }
        workout_id:     { type: string }

    PowerCurveReport:
      type: object
      properties:
        entries:   { type: array, items: { $ref: "#/components/schemas/PowerCurveEntry" } }
        ftp_watts: { type: integer }
        weight_kg: { type: number }

    WorkoutRef:
      type: object
      properties:
        id:                    { type: string }
        training_day:          { type: string, format: date, example: "2025-03-24", description: "Ride-local calendar day." }
        tss:                   { type: number }
        duration_secs:         { type: integer }
        distance_meters:       { type: number }
        elevation_gain_meters: { type: number }

    WeeklyLoad:
      type: object
      properties:
        week:                  { type: string, example: "2025-W12" }
        tss:                   { type: number }
        duration_secs:         { type: integer }
        distance_meters:       { type: number }
        elevation_gain_meters: { type: number }
        workout_count:         { type: integer }
        load_type:             { type: string, enum: [Low, Medium, High, "Very High"] }
        workout_refs:          { type: array, items: { $ref: "#/components/schemas/WorkoutRef" }, description: "Per-workout drill-down references, in training-day order." }

    ZoneBreakdown:
      type: object
      properties:
        label:      { type: string, example: "Z3" }
        name:       { type: string, example: "Tempo" }
        seconds:    { type: integer }
        pct_time:   { type: number }
        watts_low:  { type: integer, nullable: true }
        watts_high: { type: integer, nullable: true }
        bpm_low:    { type: integer, nullable: true }
        bpm_high:   { type: integer, nullable: true }

    WorkoutAnalysis:
      type: object
      properties:
        workout_id:             { type: string }
        power_zones:            { type: array, items: { $ref: "#/components/schemas/ZoneBreakdown" } }
        hr_zones:               { type: array, items: { $ref: "#/components/schemas/ZoneBreakdown" } }
        sweet_spot:             { allOf: [ { $ref: "#/components/schemas/ZoneBreakdown" } ], nullable: true, description: "Sweet Spot reference band (88–94% FTP). Overlaps Z3/Z4 — reported in parallel, not subtracted from the 7-zone totals." }
        variability_index:      { type: number, nullable: true, description: "NP / avg power — measures execution quality (1.0 = perfectly steady)" }
        efficiency_factor:      { type: number, nullable: true, description: "NP / avg HR — aerobic efficiency proxy" }
        avg_np_90day_watts:     { type: number, nullable: true }
        avg_hr_90day_bpm:       { type: number, nullable: true }
        avg_tss_90day:          { type: number, nullable: true }
        avg_if_90day:           { type: number, nullable: true }
        avg_duration_90day_secs: { type: number, nullable: true }

    EffortSummary:
      type: object
      properties:
        n:                   { type: integer, description: "1-based position of the effort in the ride" }
        start:               { type: string, example: "0:10:00", description: "Elapsed time from the start of the recording (h:mm:ss)" }
        duration_secs:       { type: integer }
        avg_watts:           { type: integer }
        pct_ftp:             { type: integer, description: "avg_watts as % of the FTP in effect on the ride date" }
        np_watts:            { type: integer, nullable: true, description: "Only on efforts of 60s or more" }
        max_watts:           { type: integer }
        avg_hr_bpm:          { type: integer, nullable: true }
        max_hr_bpm:          { type: integer, nullable: true }
        avg_cadence_rpm:     { type: integer, nullable: true, description: "Pedaling samples only" }
        recovery_after_secs: { type: integer, nullable: true, description: "Time until the next effort; absent on the last" }
        recovery_avg_watts:  { type: integer, nullable: true }

    EffortSetSummary:
      type: object
      description: A run of consecutive efforts of similar duration with short recoveries — e.g. 5×4min.
      properties:
        first_effort:       { type: integer, description: "n of the first rep" }
        reps:               { type: integer }
        avg_duration_secs:  { type: integer }
        avg_watts:          { type: integer }
        avg_pct_ftp:        { type: integer }
        rep_avg_watts:      { type: array, items: { type: integer } }
        rep_max_hr_bpm:     { type: array, items: { type: integer }, nullable: true, description: "Present only when every rep has HR" }
        rep_duration_secs:  { type: array, items: { type: integer } }
        last_vs_first_rep_pct: { type: number, description: "Last rep's avg power vs the first rep's, in percent (negative = faded, positive = built)" }
        hr_creep_bpm:       { type: integer, nullable: true, description: "Last rep's max HR minus the first rep's" }
        avg_recovery_secs:  { type: integer, nullable: true }
        avg_recovery_watts: { type: integer, nullable: true }

    WorkoutShape:
      type: object
      properties:
        workout_id:      { type: string }
        training_day:    { type: string, format: date }
        sport:           { type: string }
        elapsed_secs:    { type: integer }
        ftp_watts:       { type: integer, nullable: true, description: "FTP in effect on the ride date; every pct_ftp and the detection thresholds use it" }
        detection:
          type: object
          nullable: true
          description: Thresholds the efforts were detected against. Absent without power data or FTP.
          properties:
            start_watts: { type: integer, description: "85% FTP" }
            floor_watts: { type: integer, description: "70% FTP" }
            min_secs:    { type: integer }
            rule:        { type: string }
        efforts:         { type: array, items: { $ref: "#/components/schemas/EffortSummary" } }
        omitted_efforts: { type: integer, nullable: true, description: "Efforts left out of the list (lowest work first) when a ride has more than 40" }
        sets:            { type: array, items: { $ref: "#/components/schemas/EffortSetSummary" } }
        profile:
          type: object
          properties:
            bucket_secs: { type: integer }
            buckets:
              type: array
              items:
                type: object
                properties:
                  start:           { type: string, example: "0:10:00" }
                  avg_watts:       { type: integer, nullable: true }
                  pct_ftp:         { type: integer, nullable: true }
                  avg_hr_bpm:      { type: integer, nullable: true }
                  avg_cadence_rpm: { type: integer, nullable: true }
                  avg_speed_kph:   { type: number, nullable: true, description: "Only on rides without power" }
        planned:         { type: array, nullable: true, items: { $ref: "#/components/schemas/PlannedWorkout" }, description: "Workouts planned for the same day and sport" }
        notes:           { type: array, nullable: true, items: { type: string } }

    ReadinessReport:
      type: object
      properties:
        date:                   { type: string, format: date, example: "2025-03-24" }
        as_of:                  { type: string, format: date, example: "2025-03-23", description: "Day the load values are settled through: today once a workout with TSS is logged for today, otherwise yesterday — so form is the freshness carried into today, not a forecast of a day off" }
        fitness:                { type: number, description: "Chronic Training Load (42-day EMA of TSS)" }
        fatigue:                { type: number, description: "Acute Training Load (7-day EMA of TSS)" }
        form:                   { type: number, description: "Fitness minus Fatigue" }
        days_since_last_workout: { type: integer }
        ramp_rate:              { type: number, description: "Change in CTL (fitness) over the last 28 days" }
        recommendation:         { type: string, example: "Go Ride" }
        recommendation_detail:  { type: string }
        recommendation_tone:    { type: string, enum: [go, train, ease, rest], description: "Groups the recommendation for display" }

    WorkoutFeedback:
      type: object
      properties:
        workout_id: { type: string }
        rpe:        { type: integer, minimum: 1, maximum: 10, description: How hard the ride felt; omitted when not rated }
        note:       { type: string }
        updated_at: { type: string, format: date-time, description: Omitted when there is no feedback }

    FTPEffort:
      type: object
      properties:
        duration_secs: { type: integer, enum: [1200, 3600] }
        watts:         { type: integer, example: 226 }
        workout_id:    { type: string }
        day:           { type: string, format: date, description: The ride's training day }
        indoor:        { type: boolean, description: The effort was on an indoor ride }
        indoor_ftp_watts:
          type: integer
          example: 230
          description: The indoor FTP line the ride was scored against; omitted when the ride had no separate indoor line
        equivalent_watts:
          type: integer
          example: 259
          description: |
            The effort against the general FTP line (watts × general FTP ÷ indoor FTP at the ride),
            which is what the check compares; omitted with indoor_ftp_watts

    FTPCheck:
      type: object
      properties:
        status:         { type: string, enum: [ok, raise, lower, unverified] }
        ftp_watts:      { type: integer, example: 245 }
        window_days:    { type: integer, example: 90 }
        estimate_watts: { type: integer, example: 215, description: FTP implied by the best effort; omitted when none qualifies }
        pct_of_ftp:     { type: number, example: 87.6, description: The estimate as a percentage of FTP }
        basis:          { $ref: "#/components/schemas/FTPEffort" }
        dismissed:      { type: boolean, description: The rider chose to keep this FTP; the prompt is hidden for now }

    OkResponse:
      type: object
      properties:
        data:  { type: object, properties: { ok: { type: boolean } } }
        error: { type: string, nullable: true }

    SyncStartedResponse:
      type: object
      properties:
        data:  { type: object, properties: { status: { type: string, example: "sync started" } } }
        error: { type: string, nullable: true }

    RouteResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            route_id:   { type: string, nullable: true }
            route_name: { type: string, nullable: true }
            workouts:   { type: array, items: { $ref: "#/components/schemas/Workout" } }
        error: { type: string, nullable: true }

    Achievement:
      type: object
      properties:
        workout_id: { type: string }
        kind: { type: string, example: power_1200 }
        rank: { type: integer, minimum: 1, maximum: 3 }
        value: { type: number, description: "seconds (route_time), watts (power kinds), or meters" }

    AchievementsResponse:
      type: object
      properties:
        data:  { type: array, items: { $ref: "#/components/schemas/Achievement" } }
        error: { type: string, nullable: true }

    WorkoutListResponse:
      type: object
      properties:
        data:  { type: array, items: { $ref: "#/components/schemas/Workout" } }
        error: { type: string, nullable: true }

    WorkoutResponse:
      type: object
      properties:
        data:  { $ref: "#/components/schemas/Workout" }
        error: { type: string, nullable: true }

    SummaryResponse:
      type: object
      properties:
        data:  { $ref: "#/components/schemas/WorkoutSummary" }
        error: { type: string, nullable: true }

    StreamsResponse:
      type: object
      properties:
        data:  { type: array, items: { $ref: "#/components/schemas/Stream" } }
        error: { type: string, nullable: true }

    AthleteResponse:
      type: object
      properties:
        data:  { $ref: "#/components/schemas/Athlete" }
        error: { type: string, nullable: true }

    PeriodComparison:
      type: object
      properties:
        period:  { type: string, enum: [week, month, year, custom] }
        against: { type: string, enum: [previous, year, custom] }
        to_date: { type: boolean, description: "The period is still running and was cut at today; the comparison period was cut to match." }
        scope:   { type: string, example: cycling }
        scopes:  { type: array, items: { type: string }, description: "The sports the rider has workouts in, most first." }
        reference: { $ref: "#/components/schemas/MatchReference" }
        a: { $ref: "#/components/schemas/PeriodStats" }
        b: { $ref: "#/components/schemas/PeriodStats" }
        rows: { type: array, items: { $ref: "#/components/schemas/ComparisonRow" } }
        curve_durations_secs: { type: array, items: { type: integer }, description: "The durations of each period's curve_watts." }
        weight_kg: { type: number, description: "Today's weight; there is no weight history." }

    MatchReference:
      type: object
      description: "The power and heart rate matched markers are read at, per environment: the median of the steady rides. Absent where there were none."
      properties:
        power_outdoor_watts: { type: integer, example: 185 }
        power_indoor_watts:  { type: integer, example: 170 }
        hr_outdoor_bpm:      { type: integer, example: 138 }
        hr_indoor_bpm:       { type: integer, example: 142 }

    Marker:
      type: object
      properties:
        value:      { type: number }
        rides:      { type: integer, description: "How many rides the average is from." }
        matched_at: { type: number, description: "For a matched marker, the mean power or HR of the rides near the reference." }

    EnvMarkers:
      type: object
      description: "A marker with outdoor and indoor rides kept apart; either may be absent."
      properties:
        outdoor: { $ref: "#/components/schemas/Marker" }
        indoor:  { $ref: "#/components/schemas/Marker" }

    IntensitySplit:
      type: object
      properties:
        easy_pct:   { type: number, description: "Z1–Z2 share of power-zone time" }
        middle_pct: { type: number, description: "Z3–Z4" }
        hard_pct:   { type: number, description: "Z5 and above" }

    PeriodStats:
      type: object
      properties:
        label:     { type: string, example: "November 2026" }
        first_day: { type: string, format: date }
        last_day:  { type: string, format: date }
        days:      { type: integer }
        activities:            { type: integer }
        active_days:           { type: integer }
        duration_secs:         { type: integer, description: "Moving time" }
        distance_meters:       { type: number }
        elevation_gain_meters: { type: number }
        tss:                   { type: number }
        work_kj:               { type: number, description: "Cycling rides with power: average power × moving time." }
        power_rides:           { type: integer, description: "Cycling rides with power." }
        avg_if:                { type: number, description: "Duration-weighted, cycling rides with power." }
        avg_np_watts:          { type: number, description: "Duration-weighted, cycling rides with power." }
        avg_hr_bpm:            { type: number, description: "Duration-weighted, activities in scope with HR." }
        power_zone_secs:       { type: array, items: { type: integer }, minItems: 7, maxItems: 7, description: "Z1–Z7, cycling" }
        hr_zone_secs:          { type: array, items: { type: integer }, minItems: 5, maxItems: 5 }
        intensity_split:       { $ref: "#/components/schemas/IntensitySplit" }
        ef:                    { $ref: "#/components/schemas/EnvMarkers" }
        hr_at_power_bpm:       { $ref: "#/components/schemas/EnvMarkers" }
        power_at_hr_watts:     { $ref: "#/components/schemas/EnvMarkers" }
        decoupling_pct:        { $ref: "#/components/schemas/Marker" }
        bests:
          type: array
          items:
            type: object
            properties:
              duration_secs: { type: integer, enum: [5, 60, 300, 1200, 3600] }
              watts:         { type: integer }
              workout_id:    { type: string }
        curve_watts: { type: array, items: { type: integer, nullable: true } }
        avg_rpe:     { type: number }
        rated_rides: { type: integer }
        rpe:
          type: array
          items:
            type: object
            properties:
              workout_id: { type: string }
              day:        { type: string, format: date }
              rpe:        { type: integer, minimum: 1, maximum: 10 }
              tss:        { type: number }
        indoor:  { type: object, properties: { activities: { type: integer }, duration_secs: { type: integer } } }
        outdoor: { type: object, properties: { activities: { type: integer }, duration_secs: { type: integer } } }
        sports:
          type: array
          description: "Every sport, whatever the scope."
          items:
            type: object
            properties:
              sport:           { type: string }
              activities:      { type: integer }
              duration_secs:   { type: integer }
              distance_meters: { type: number }
              tss:             { type: number }

    ComparisonRow:
      type: object
      properties:
        group: { type: string, enum: [volume, intensity, efficiency, heart_rate, power, rpe, mix] }
        key:   { type: string, example: hr_at_power_outdoor }
        label: { type: string, example: "HR at 185 W · outdoor" }
        unit:  { type: string, enum: [duration_secs, distance_meters, elevation_meters, count, tss, kj, if, watts, bpm, ef, pct, rpe] }
        a:     { type: number, nullable: true, description: "Rounded as shown: IF and EF to 2 decimals, RPE and percentages to 1, watts, bpm, TSS and kJ whole" }
        b:     { type: number, nullable: true }
        delta:     { type: number, description: "a − b, when both are present" }
        delta_pct: { type: number, description: "The change as a percentage of b; absent for percentages and when b is 0" }
        better:    { type: string, enum: [higher, lower, closer_to_zero], description: "Present only when that direction is plainly better: higher for power bests, EF and power at matched HR; lower for HR at matched power; closer_to_zero for decoupling, where drift either way is worse. Volume and intensity have none." }
        verdict:   { type: string, enum: [better, worse], description: "Present when better applies and the change is more than a ride-to-ride wobble (2%, or half a point for a percentage)." }
        rides_a:   { type: integer, description: "How many rides an averaged marker is from" }
        rides_b:   { type: integer }

    AnalyticsTrends:
      type: object
      properties:
        range:     { type: string, enum: ["3m", "6m", "1y", "2y", all] }
        first_day: { type: string, format: date }
        last_day:  { type: string, format: date }
        bucket:    { type: string, enum: [week, month] }
        weight_kg: { type: number }
        reference: { $ref: "#/components/schemas/MatchReference" }
        ftp:
          type: object
          description: "FTP set (step lines) against the FTP the rides implied each week: the higher of 95% of the best 20 min and the best hour over the previous 90 days. The general estimate reads indoor efforts against the general line, as the FTP check does; indoor_estimate is indoor rides against the indoor line, when there is one."
          properties:
            general:         { type: array, items: { $ref: "#/components/schemas/FTPPoint" } }
            indoor:          { type: array, items: { $ref: "#/components/schemas/FTPPoint" } }
            estimate:        { type: array, items: { $ref: "#/components/schemas/FTPPoint" } }
            indoor_estimate: { type: array, items: { $ref: "#/components/schemas/FTPPoint" } }
        power_curve:
          type: object
          properties:
            durations: { type: array, items: { type: integer } }
            all_time:  { type: array, items: { type: integer, nullable: true } }
            days_90:   { type: array, items: { type: integer, nullable: true } }
            days_28:   { type: array, items: { type: integer, nullable: true } }
        fitness: { type: array, items: { $ref: "#/components/schemas/FitnessPoint" } }
        ramp:
          type: array
          items:
            type: object
            properties:
              week_start: { type: string, format: date }
              ctl_change: { type: number, description: "How far fitness (CTL) moved that week" }
        load_weeks:  { type: array, items: { $ref: "#/components/schemas/LoadBucket" } }
        load_months: { type: array, items: { $ref: "#/components/schemas/LoadBucket" } }
        buckets:     { type: array, items: { $ref: "#/components/schemas/TrendBucket" } }
        rides:
          type: array
          description: "Per-ride points for scatter charts: rides with an EF (steady), a decoupling (long steady) or an RPE."
          items:
            type: object
            properties:
              id:             { type: string }
              day:            { type: string, format: date }
              indoor:         { type: boolean }
              ef:             { type: number }
              decoupling_pct: { type: number }
              tss:            { type: number }
              rpe:            { type: integer }
        best_efforts:
          type: object
          properties:
            durations_secs: { type: array, items: { type: integer } }
            months:
              type: array
              items:
                type: object
                properties:
                  month: { type: string, example: "2026-11" }
                  watts: { type: array, items: { type: integer, nullable: true } }
        consistency:
          type: object
          properties:
            current_streak_days: { type: integer }
            longest_streak_days: { type: integer }
            longest_streak_end:  { type: string, format: date }
            current_week_streak: { type: integer, description: "Consecutive weeks with a workout, through this week or last" }
            longest_week_streak: { type: integer }
            avg_days_per_week:   { type: number, description: "Over the range" }

    FTPPoint:
      type: object
      properties:
        t: { type: integer, description: "Unix seconds" }
        w: { type: integer, description: "Watts" }

    LoadBucket:
      type: object
      properties:
        start:                 { type: string, format: date }
        activities:            { type: integer }
        duration_secs:         { type: integer }
        distance_meters:       { type: number }
        elevation_gain_meters: { type: number }
        tss:                   { type: number }
        planned_tss:           { type: number }
        planned_secs:          { type: integer }

    TrendBucket:
      type: object
      properties:
        start:             { type: string, format: date }
        ef:                { $ref: "#/components/schemas/EnvMarkers" }
        hr_at_power_bpm:   { $ref: "#/components/schemas/EnvMarkers" }
        power_at_hr_watts: { $ref: "#/components/schemas/EnvMarkers" }
        decoupling_pct:    { $ref: "#/components/schemas/Marker" }
        cadence_rpm:       { $ref: "#/components/schemas/EnvMarkers" }
        if_bands:          { type: array, items: { type: integer }, description: "Cycling rides by IF: under 0.65, 0.65–0.75, 0.75–0.85, 0.85–0.95, 0.95 and over" }
        intensity_split:   { $ref: "#/components/schemas/IntensitySplit" }
        avg_rpe:           { $ref: "#/components/schemas/Marker" }
        tss:               { type: number }
        cycling_days:      { type: integer, description: "Days with a ride" }
        other_days:        { type: integer, description: "Days with only other workouts" }
        days:              { type: integer, description: "Days of the bucket inside the range" }

    YearOverYear:
      type: object
      properties:
        scope:  { type: string }
        scopes: { type: array, items: { type: string } }
        today:  { type: object, properties: { year: { type: integer }, day_of_year: { type: integer } } }
        years:
          type: array
          items:
            type: object
            properties:
              year: { type: integer }
              days:
                type: array
                items:
                  type: object
                  properties:
                    day_of_year:           { type: integer }
                    duration_secs:         { type: integer }
                    distance_meters:       { type: number }
                    elevation_gain_meters: { type: number }
                    tss:                   { type: number }

    FitnessResponse:
      type: object
      properties:
        data:  { type: array, items: { $ref: "#/components/schemas/FitnessPoint" } }
        error: { type: string, nullable: true }

  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }

    Unauthorized:
      description: Integration not connected
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
